name: Validate divination backend
on:
  push:
    paths:
      - 'static/python/diviner/**'
      - 'tests/test_divine_server.py'
      - '.github/workflows/diviner.yml'
  pull_request:
    paths:
      - 'static/python/diviner/**'
      - 'tests/test_divine_server.py'
      - '.github/workflows/diviner.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r static/python/diviner/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
